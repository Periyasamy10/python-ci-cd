name: Python build
on:
  push:
    branches:
     - main
  workflow_dispatch:
    inputs:
      env:
        description: "Environment"
        required: false
        default: dev

permissions:
  contents: read
  id-token: write
  security-events: write

concurrency:
  group: python-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  Quality-Check:
    uses: ./quality.yml
    with:
      env: ${{ inputs.env || 'dev' }}