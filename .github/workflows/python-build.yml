name: Python build
on:
  workflow_call:
    inputs:
      env:
        description: "Environment"
        type: string
        required: false
        default: dev
      image-tag:
        description: "Image Tag"
        required: true
        type: string    

permissions:
  contents: read
  id-token: write
  security-events: write

jobs:
  python-build:
    runs-on: ubuntu-latest
    environment: ${{ inputs.env }}
    timeout-minutes: 20

    steps:
      - name: checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
           
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume:  ${{ secrets.ROLE_TO_ASSUME }}
          aws-region: ${{ vars.AWS_REGION }}
     
      - name: Login to ECR
        uses: aws-actions/amazon-ecr-login@v2
        id: login-ecr
      
      - name: Setup Buildx
        uses: docker/setup-buildx-action@v3   
      
      - name: Docker Buildx
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          tags:
            ${{ steps.login-ecr.outputs.registry }}/${{ vars.REPO }}:${{ inputs.image-tag }}
          cache-from: type=gha
          cache-to: type=gha, mode=max
          outputs: type=docker
          provenance: false

