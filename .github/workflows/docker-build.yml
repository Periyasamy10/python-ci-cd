name: Python Build
on: 
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  python-build:
    runs-on: ubuntu-latest
    steps:
      - name: checkout
        uses: actions/checkout@v4
      - name: setup ruff
        run: |
          pip install ruff
          ruff check .
          echo "Ruff check passed" >> $GITHUB_STEP_SUMMARY
      - name: setup pytest
        run: |
          pip install pytest
          python -m pytest
          echo "pytest passed" >> $GITHUB_STEP_SUMMARY
      - name: docker build
        run: |
          docker build -t python:v1 .

