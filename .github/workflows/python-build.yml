name: Python build
on:
  workflow_call:
    inputs:
      env:
        description: "Environment"
        type: string
        required: false
        default: dev
      image-tag:
        description: "Image Tag"
        required: true
        type: string    

permissions:
  contents: read
  id-token: write
  security-events: write

jobs:
  python-build:
    runs-on: ubuntu-latest
    environment: ${{ inputs.env }}
    timeout-minutes: 20

    steps:
      - name: checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
      
      - name: Print Role ARN
        run: |
          echo "${ROLE}"
        env:
          ROLE: ${{ secrets.ROLE_TO_ASSUME }}
      
      - name: Debug
        run: |
          echo "Environment = ${{ inputs.env }}"
          echo "Region = ${{ vars.AWS_REGION }}"
          echo "Role Length = ${#ROLE}"
        env:
          ROLE: ${{ secrets.ROLE_TO_ASSUME }}
      
      - name: Debug GitHub Context
        run: |
          echo "Repository: ${{ github.repository }}"
          echo "Ref: ${{ github.ref }}"
          echo "Environment: ${{ inputs.env }}"
      
      - name: Check OIDC
        run: |
          echo "OIDC URL: $ACTIONS_ID_TOKEN_REQUEST_URL"
      
          if [ -z "$ACTIONS_ID_TOKEN_REQUEST_URL" ]; then
            echo "OIDC NOT AVAILABLE"
            exit 1
          fi
      
          echo "OIDC AVAILABLE"
      
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::900572647330:role/github-action
          aws-region: ${{ vars.AWS_REGION }}
      
      - name: Login to ECR
        uses: aws-actions/amazon-ecr-login@v2
        id: login-ecr
      
      - name: Setup Buildx
        uses: docker/setup-buildx-action@v3   
      
      - name: Docker Buildx
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          tags:
            ${{ steps.login-ecr.outputs.registry }}/${{ vars.REPO }}:${{ inputs.image-tag }}
          cache-from: type=gha
          cache-to: type=gha, mode=max
          outputs: type=docker
          provenance: false

