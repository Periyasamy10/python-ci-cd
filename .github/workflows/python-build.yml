name: Python build
on:
  workflow_call:
    inputs:
      env:
        description: "Environment"
        type: string
        required: false
        default: dev
      image-tag:
        description: "Image Tag"
        required: true
        type: string    

permissions:
  contents: read
  id-token: write
  security-events: write

jobs:
  python-build:
    runs-on: ubuntu-latest
    environment: ${{ inputs.env }}
    timeout-minutes: 20
    outputs:
      image_uri: ${{ steps.image.outputs.Image_URI }}

    steps:
      - name: checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
           
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume:  ${{ secrets.ROLE_TO_ASSUME }}
          aws-region: ${{ vars.AWS_REGION }}
     
      - name: Login to ECR
        uses: aws-actions/amazon-ecr-login@v2
        id: login-ecr
      
      - name: Setup Buildx
        uses: docker/setup-buildx-action@v3   
      
      - name: Docker Buildx
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          tags:
            ${{ steps.login-ecr.outputs.registry }}/${{ vars.REPO }}:${{ inputs.image-tag }}
          cache-from: type=gha
          cache-to: type=gha, mode=max
          outputs: type=docker
          provenance: false
      
      - name: Save Image URI
        id: image
        run: |
          echo "Image_URI=${{ steps.login-ecr.outputs.registry }}/${{ vars.REPO }}:${{ inputs.image-tag }}" >> $GITHUB_OUTPUT


  image-scan:

    name: Trivy Image Scan

    runs-on: ubuntu-latest

    needs:
      - docker-build

    timeout-minutes: 15

    steps:

      - name: Scan Docker Image
        uses: aquasecurity/trivy-action@0.28.0
        with:
          image-ref: ${{ needs.docker-build.outputs.image_uri }}
          format: table
          exit-code: 1
          ignore-unfixed: true
          vuln-type: os,library
          severity: CRITICAL,HIGH
  
  push-image:
    runs-on: ubuntu-latest
    needs: ["python-build", "image-scan"]
    environment: ${{ inputs.env }}
    timeout-minutes: 30

    steps:
      - name: checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
      
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.ROLE_TO_ASSUME }}
          aws-region: ${{ vars.AWS_REGION }}
      
      - name: Login to ECR
        uses: aws-actions/amazon-ecr-login@v2
        id: ecr-login
      
      - name: setup buildx
        uses: docker/setup-buildx-action@v3
      
      - name: Docker push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ steps.login-ecr.outputs.registry }}/${{ vars.REPO }}:${{ inputs.image-tag }}
          cache-from: type=gha
          cache-to: type=gha, mode=max
          outputs: type=docker
          provenance: false
            
